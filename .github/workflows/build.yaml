name: Build and Test

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: [1.25.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

  build:
    name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Linux
          - { os: linux, arch: amd64, name: linux-x64, binary: x2j-linux-x64 }
          - { os: linux, arch: 386, name: linux-x86, binary: x2j-linux-x86 }
          # Windows
          - { os: windows, arch: amd64, name: windows-x64, binary: x2j-windows-x64.exe }
          - { os: windows, arch: 386, name: windows-x86, binary: x2j-windows-x86.exe }
          # macOS
          - { os: darwin, arch: amd64, name: macos-x64, binary: x2j-macos-x64 }
          - { os: darwin, arch: arm64, name: macos-arm64, binary: x2j-macos-arm64 }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.25.x

    - name: Set up environment
      run: |
        echo "GOOS=${{ matrix.target.os }}" >> $GITHUB_ENV
        echo "GOARCH=${{ matrix.target.arch }}" >> $GITHUB_ENV

    - name: Tidy and verify modules
      run: |
        go mod tidy
        go mod verify

    - name: Build binary
      run: |
        # Build the application with the correct name
        echo "Building for ${{ matrix.target.name }} (${{ matrix.target.os }}/${{ matrix.target.arch }})"
        CGO_ENABLED=0 GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} go build -o ${{ matrix.target.binary }} .
        
        # Show file information
        ls -la ${{ matrix.target.binary }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x2j-${{ matrix.target.name }}
        path: ${{ matrix.target.binary }}

  mobile-build:
    name: Build Mobile Libraries
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.25.x

    - name: Install Android SDK
      uses: malinskiy/action-android/install-sdk@release/0.1.4

    - name: Install gomobile and dependencies
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/bind@latest
        gomobile init

    - name: Check if mobile packages exist
      id: check_mobile
      run: |
        if [ -d "android" ] || [ -d "ios" ]; then
          echo "mobile_packages_exist=true" >> $GITHUB_OUTPUT
        else
          echo "mobile_packages_exist=false" >> $GITHUB_OUTPUT
        fi

    - name: Build Mobile Libraries (if packages exist)
      if: steps.check_mobile.outputs.mobile_packages_exist == 'true'
      run: |
        echo "Building mobile libraries..."
        # Create build directories
        mkdir -p build/android
        mkdir -p build/ios
        
        # Build Android library if android directory exists
        if [ -d "android" ]; then
          echo "Building Android library..."
          gomobile bind -v -target=android -androidapi 23 -ldflags "-checklinkname=0" -o build/android/x2j.aar ./android
        fi
        
        # Build iOS framework if ios directory exists
        if [ -d "ios" ]; then
          echo "Building iOS framework..."
          # Note: iOS build requires macOS environment, so this will be skipped on Ubuntu
          echo "iOS build requires macOS environment, skipping..."
        fi

    - name: Skip Mobile Build (no mobile packages)
      if: steps.check_mobile.outputs.mobile_packages_exist == 'false'
      run: |
        echo "No mobile packages found, skipping mobile build"
        mkdir -p build/android
        mkdir -p build/ios

    - name: Build Windows DLLs
      run: |
        # Build Windows DLL for x64
        mkdir -p build/windows/x64
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -v -o build/windows/x64/x2j.dll -buildmode=c-shared .
        
        # Build Windows DLL for x86
        mkdir -p build/windows/x86
        CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -v -o build/windows/x86/x2j.dll -buildmode=c-shared .

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x2j-android
        path: |
          build/android/*.aar
          build/android/*.jar

    - name: Package iOS Framework
      run: |
        cd build/ios
        # Create a placeholder file since we're not building iOS on Ubuntu
        touch ios-build-skipped.txt
        echo "iOS build requires macOS environment" > ios-build-skipped.txt

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: x2j-ios
        path: build/ios/*

    - name: Upload Windows DLL Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x2j-windows-dll
        path: |
          build/windows/x64/*
          build/windows/x86/*

  release:
    name: Create Release
    needs: [build, mobile-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set tag name
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        else
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: downloaded-artifacts

    - name: Prepare release assets
      run: |
        # Create a directory for all release assets
        mkdir -p release-assets
        
        # Move all binaries from downloaded artifact directories to the release-assets directory
        find downloaded-artifacts -name "x2j-*" -type f -exec mv {} release-assets/ \;
        
        # Also move mobile artifacts
        find downloaded-artifacts -name "*.aar" -type f -exec mv {} release-assets/ \;
        find downloaded-artifacts -name "*.jar" -type f -exec mv {} release-assets/ \;
        find downloaded-artifacts -name "*.xcframework.zip" -type f -exec mv {} release-assets/ \;
        
        # Move Windows DLLs from their subdirectories
        find downloaded-artifacts -path "*/x64/*.dll" -type f -exec cp {} release-assets/x2j-windows-x64.dll \;
        find downloaded-artifacts -path "*/x86/*.dll" -type f -exec cp {} release-assets/x2j-windows-x86.dll \;
        
        # If DLLs don't exist with full path, look for them in any directory
        find downloaded-artifacts -name "x2j.dll" -type f | while read file; do
          dir_name=$(dirname "$file")
          if [[ "$dir_name" == *"/x64"* ]]; then
            cp "$file" release-assets/x2j-windows-x64.dll
          elif [[ "$dir_name" == *"/x86"* ]]; then
            cp "$file" release-assets/x2j-windows-x86.dll
          fi
        done
        
        # List the release assets
        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        release_name: DNS Leak Test ${{ env.TAG_NAME }}
        body: |
          ## 🚀 X2J Release

          ### 💻 Installation

          #### From Binary (Recommended)
          Download the appropriate binary for your platform from the table below and run it directly.

          #### From Source
          ```bash
          git clone https://github.com/code3-dev/x2j.git
          cd x2j
          go build .
          ./x2j  # or ./x2j.exe on Windows
          ```

          ### ⬇️ Download

          | Platform | Architecture | Download |
          |----------|-------------|----------|
          | Windows | x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-windows-x64.exe"><img src="https://img.shields.io/badge/Windows-x64-0078D6?style=for-the-badge&logo=windows&logoColor=white" alt="Windows x64"></a> |
          | Windows | x86 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-windows-x86.exe"><img src="https://img.shields.io/badge/Windows-x86-0078D6?style=for-the-badge&logo=windows&logoColor=white" alt="Windows x86"></a> |
          | Windows | DLL x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-windows-x64.dll"><img src="https://img.shields.io/badge/Windows-DLL_x64-0078D6?style=for-the-badge&logo=windows&logoColor=white" alt="Windows DLL x64"></a> |
          | Windows | DLL x86 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-windows-x86.dll"><img src="https://img.shields.io/badge/Windows-DLL_x86-0078D6?style=for-the-badge&logo=windows&logoColor=white" alt="Windows DLL x86"></a> |
          | Linux | x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-linux-x64"><img src="https://img.shields.io/badge/Linux-x64-FCC624?style=for-the-badge&logo=linux&logoColor=black" alt="Linux x64"></a> |
          | Linux | x86 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-linux-x86"><img src="https://img.shields.io/badge/Linux-x86-FCC624?style=for-the-badge&logo=linux&logoColor=black" alt="Linux x86"></a> |
          | macOS | x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-macos-x64"><img src="https://img.shields.io/badge/macOS-x64-000000?style=for-the-badge&logo=apple&logoColor=white" alt="macOS x64"></a> |
          | macOS | ARM64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-macos-arm64"><img src="https://img.shields.io/badge/macOS-ARM64-000000?style=for-the-badge&logo=apple&logoColor=white" alt="macOS ARM64"></a> |
          | Android | AAR | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j.aar"><img src="https://img.shields.io/badge/Android-AAR-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android AAR"></a> |
          | Android | JAR | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j.jar"><img src="https://img.shields.io/badge/Android-JAR-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android JAR"></a> |
          | iOS | Framework | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/IosX2J.xcframework.zip"><img src="https://img.shields.io/badge/iOS-Framework-000000?style=for-the-badge&logo=apple&logoColor=white" alt="iOS Framework"></a> |
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
        tag_name: ${{ env.TAG_NAME }}
        token: ${{ secrets.GITHUB_TOKEN }}