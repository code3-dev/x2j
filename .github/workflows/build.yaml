name: Build and Test

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: [1.25.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Print Go version
      run: go version

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

  build:
    name: Build for ${{ matrix.target.os }}/${{ matrix.target.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # Linux
          - { os: linux, arch: amd64, name: linux-x64, binary: x2j-linux-x64, final_binary: x2j }
          - { os: linux, arch: 386, name: linux-x86, binary: x2j-linux-x86, final_binary: x2j }
          # Windows
          - { os: windows, arch: amd64, name: windows-x64, binary: x2j-windows-x64.exe, final_binary: x2j.exe }
          - { os: windows, arch: 386, name: windows-x86, binary: x2j-windows-x86.exe, final_binary: x2j.exe }
          # macOS
          - { os: darwin, arch: amd64, name: macos-x64, binary: x2j-macos-x64, final_binary: x2j }
          - { os: darwin, arch: arm64, name: macos-arm64, binary: x2j-macos-arm64, final_binary: x2j }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.25.x

    - name: Set up environment
      run: |
        echo "GOOS=${{ matrix.target.os }}" >> $GITHUB_ENV
        echo "GOARCH=${{ matrix.target.arch }}" >> $GITHUB_ENV

    - name: Tidy and verify modules
      run: |
        go mod tidy
        go mod verify

    - name: Build binary
      run: |
        # Build the application with the correct name
        echo "Building for ${{ matrix.target.name }} (${{ matrix.target.os }}/${{ matrix.target.arch }})"
        CGO_ENABLED=0 GOOS=${{ matrix.target.os }} GOARCH=${{ matrix.target.arch }} go build -o ${{ matrix.target.binary }} .
        
        # Show file information
        ls -la ${{ matrix.target.binary }}

    - name: Rename binary and create ZIP archive
      run: |
        # Rename the binary to the final name
        mv ${{ matrix.target.binary }} ${{ matrix.target.final_binary }}
        
        # Create ZIP archive containing the binary and README.md
        if [[ "${{ matrix.target.os }}" == "windows" ]]; then
          # On Windows, we need to use 7z or PowerShell for ZIP creation
          # But in Ubuntu runner, we can use zip command
          zip x2j-${{ matrix.target.name }}.zip ${{ matrix.target.final_binary }} README.md LICENSE
        else
          # On Linux and macOS
          zip x2j-${{ matrix.target.name }}.zip ${{ matrix.target.final_binary }} README.md LICENSE
        fi
        
        # Show the created ZIP file
        ls -la x2j-${{ matrix.target.name }}.zip

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x2j-${{ matrix.target.name }}
        path: |
          x2j-${{ matrix.target.name }}.zip
          ${{ matrix.target.final_binary }}

  mobile-build:
    name: Build Mobile Libraries
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.25.x

    - name: Install Android SDK
      uses: malinskiy/action-android/install-sdk@release/0.1.4
      with:
        # Use the latest cmdline-tools
        cmdline-tools-version: latest
        # Add packages to install
        packages: >
          platforms;android-35
          build-tools;35.0.0

    - name: Set up environment variables
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        # Add multiple possible paths for Android tools
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/bin:$ANDROID_HOME/cmdline-tools/bootstrap-version/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV

    - name: Download Go dependencies
      run: |
        go mod tidy
        go mod download

    - name: Install gomobile with bind package
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/bind@latest
        gomobile init
        # Verify gomobile installation
        gomobile version

    - name: Verify mobile bind dependency
      run: |
        go list golang.org/x/mobile/bind

    - name: Check if mobile packages exist
      id: check_mobile
      run: |
        if [ -d "android" ] || [ -d "ios" ]; then
          echo "mobile_packages_exist=true" >> $GITHUB_OUTPUT
        else
          echo "mobile_packages_exist=false" >> $GITHUB_OUTPUT
        fi

    - name: Build Mobile Libraries (if packages exist)
      if: steps.check_mobile.outputs.mobile_packages_exist == 'true'
      run: |
        echo "Building mobile libraries..."
        # Create build directories
        mkdir -p build/android
        mkdir -p build/ios
        
        # Debug information
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "PATH: $PATH"
        echo "Available Android platforms:"
        ls -la $ANDROID_HOME/platforms/ || echo "No platforms directory found"
        
        # Check if sdkmanager is available in PATH
        which sdkmanager || echo "sdkmanager not found in PATH"
        
        # Build Android library if android directory exists
        if [ -d "android" ]; then
          echo "Building Android library..."
          # Verify that required platform is installed
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Error: Android SDK platform 35 not found"
            # Try to install it again
            SDK_MANAGER_PATH=""
            if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDK_MANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            elif [ -f "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
              SDK_MANAGER_PATH="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
            elif [ -f "$ANDROID_HOME/cmdline-tools/bootstrap-version/bin/sdkmanager" ]; then
              SDK_MANAGER_PATH="$ANDROID_HOME/cmdline-tools/bootstrap-version/bin/sdkmanager"
            fi
            
            if [ -n "$SDK_MANAGER_PATH" ]; then
              echo "Trying to install Android SDK platform 35 again..."
              echo "y" | $SDK_MANAGER_PATH "platforms;android-35" "build-tools;35.0.0"
            else
              echo "Cannot find sdkmanager to install platform"
              exit 1
            fi
          fi
          
          gomobile bind -v -target=android -androidapi 35 -ldflags "-checklinkname=0" -o build/android/x2j.aar ./android
          if [ $? -eq 0 ]; then
            echo "✅ Android library built successfully"
          else
            echo "❌ Failed to build Android library"
            exit 1
          fi
        fi
        
        # Note: iOS build requires macOS environment, so we'll handle it in a separate job

    - name: Skip Mobile Build (no mobile packages)
      if: steps.check_mobile.outputs.mobile_packages_exist == 'false'
      run: |
        echo "No mobile packages found, skipping mobile build"
        mkdir -p build/android
        mkdir -p build/ios

    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x2j-android
        path: |
          build/android/*.aar
          build/android/*.jar
          build/android/*

  ios-build:
    name: Build iOS Framework
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.25.x

    - name: Download Go dependencies
      run: |
        go mod tidy
        go mod download

    - name: Install gomobile with bind package
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/bind@latest
        gomobile init
        # Verify gomobile installation
        gomobile version

    - name: Check if iOS package exists
      id: check_ios
      run: |
        if [ -d "ios" ]; then
          echo "ios_package_exists=true" >> $GITHUB_OUTPUT
        else
          echo "ios_package_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build iOS Framework (if package exists)
      if: steps.check_ios.outputs.ios_package_exists == 'true'
      run: |
        echo "Building iOS framework..."
        # Create build directory
        mkdir -p build/ios
        
        # Build iOS framework
        echo "Building iOS framework with gomobile..."
        gomobile bind -v -target=ios -ldflags "-checklinkname=0" -o build/ios/IosX2J.xcframework ./ios
        if [ $? -eq 0 ]; then
          echo "✅ iOS framework built successfully"
          # Package as zip for release
          echo "Packaging iOS framework as zip..."
          cd build/ios
          zip -r IosX2J.xcframework.zip IosX2J.xcframework
          cd ../..
          echo "✅ iOS framework packaged as zip"
        else
          echo "❌ Failed to build iOS framework"
          exit 1
        fi

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: x2j-ios-framework
        path: build/ios/IosX2J.xcframework.zip

  release:
    name: Create Release
    needs: [build, mobile-build, ios-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set tag name
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        else
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: downloaded-artifacts

    - name: Prepare release assets
      run: |
        # Create a directory for all release assets
        mkdir -p release-assets
        
        # Move ZIP files from downloaded artifact directories to the release-assets directory
        find downloaded-artifacts -name "x2j-*.zip" -type f -exec mv {} release-assets/ \;
        
        # Also move mobile artifacts
        find downloaded-artifacts -name "*.aar" -type f -exec mv {} release-assets/ \;
        find downloaded-artifacts -name "*.jar" -type f -exec mv {} release-assets/ \;
        find downloaded-artifacts -name "*.xcframework.zip" -type f -exec mv {} release-assets/ \;
        
        # Ensure Android artifacts have proper names
        if [ -f "release-assets/x2j.aar" ]; then
          mv release-assets/x2j.aar release-assets/x2j-android.aar
        fi
        
        # Ensure iOS framework has proper name (if it was uploaded separately)
        if [ -f "release-assets/IosX2J.xcframework.zip" ]; then
          echo "iOS framework zip found and ready for release"
        fi
        
        # List the release assets
        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        release_name: X2J ${{ env.TAG_NAME }}
        body: |
          ## 🚀 X2J Release

          ### 💻 Installation

          #### From Binary (Recommended)
          Download the appropriate binary for your platform from the table below and run it directly.

          #### From Source
          ```bash
          git clone https://github.com/code3-dev/x2j.git
          cd x2j
          go mod tidy
          go build .
          ./x2j  # or ./x2j.exe on Windows
          ```

          ### ⬇️ Download

          | Platform | Architecture | Download |
          |----------|-------------|----------|
          | Windows | x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-windows-x64.zip"><img src="https://img.shields.io/badge/Windows-x64-0078D6?style=for-the-badge&logo=windows&logoColor=white" alt="Windows x64"></a> |
          | Windows | x86 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-windows-x86.zip"><img src="https://img.shields.io/badge/Windows-x86-0078D6?style=for-the-badge&logo=windows&logoColor=white" alt="Windows x86"></a> |
          | Linux | x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-linux-x64.zip"><img src="https://img.shields.io/badge/Linux-x64-FCC624?style=for-the-badge&logo=linux&logoColor=black" alt="Linux x64"></a> |
          | Linux | x86 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-linux-x86.zip"><img src="https://img.shields.io/badge/Linux-x86-FCC624?style=for-the-badge&logo=linux&logoColor=black" alt="Linux x86"></a> |
          | macOS | x64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-macos-x64.zip"><img src="https://img.shields.io/badge/macOS-x64-000000?style=for-the-badge&logo=apple&logoColor=white" alt="macOS x64"></a> |
          | macOS | ARM64 | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-macos-arm64.zip"><img src="https://img.shields.io/badge/macOS-ARM64-000000?style=for-the-badge&logo=apple&logoColor=white" alt="macOS ARM64"></a> |
          | Android | AAR | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j-android.aar"><img src="https://img.shields.io/badge/Android-AAR-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android AAR"></a> |
          | Android | JAR | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/x2j.jar"><img src="https://img.shields.io/badge/Android-JAR-3DDC84?style=for-the-badge&logo=android&logoColor=white" alt="Android JAR"></a> |
          | iOS | Framework | <a href="https://github.com/code3-dev/x2j/releases/download/${{ env.TAG_NAME }}/IosX2J.xcframework.zip"><img src="https://img.shields.io/badge/iOS-Framework-000000?style=for-the-badge&logo=apple&logoColor=white" alt="iOS Framework"></a> |
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*
        tag_name: ${{ env.TAG_NAME }}
        token: ${{ secrets.GITHUB_TOKEN }}